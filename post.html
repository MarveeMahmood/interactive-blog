<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post</title>
    <link rel="stylesheet" href="style.css">
</head>

    <body>
        <header>
            <a class="back-link" href="index.html">Back to Home</a>
            <h1>Post Details</h1>   
        </header>

        <main>
            <p class="error-message"></p>
            <article class="post-details"></article>

            <!--Edit form--> 
            <button class="edit-button" type="button">Edit post</button>
            <form class="comment-form edit-form">
                <label for="edit-title">Title:</label>
                <input id="edit-title" type="text" required>
                <label for="edit-body">Content:</label>
                <textarea id="edit-body" required></textarea>
                <button type="submit">Save changes</button>
            </form>

            <section class="comments">
                <h2>Comments</h2>
                <form class="comment-form">
                    <label for="comment-input">Write a comment:</label>
                    <textarea id="comment-input" required></textarea>
                    <button type="submit">Add comment</button>
                </form>
                <p class="no-comments"></p>
                <ul class="comments-list"></ul>

            </section>

            
        </main>

        <script src="post.js"></script>
    </body>
</html>
